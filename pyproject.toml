[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bedtime-audio-studio"
version = "0.1.0"
description = "Apple Silicon transcription and semantic audiobook preparation"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "mlx-whisper>=0.4.3,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm>=0.28,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mutagen>=1.47,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
audio-studio = "audio_studio.gui:main"

[tool.setuptools.packages.find]
include = ["audio_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
